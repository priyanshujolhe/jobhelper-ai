{% extends "base.html" %}

{% block title %}Access Denied (403) — JobHelper AI{% endblock %}

{% block content %}
<div class="container py-5 text-center min-vh-75 d-flex flex-column justify-content-center align-items-center">
  <div class="display-1 fw-bold text-danger mb-2">403</div>
  <h2 class="fw-bold mb-3">Access Denied</h2>
  <p class="text-muted max-w-500 mb-4">
    You do not have authorization to access this private resume record or report. Users can only access their own data.
  </p>
  <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary px-4">
    <i class="bi bi-shield-lock me-1"></i> Return to Your Dashboard
  </a>
</div>
{% endblock %}
