{% extends "base.html" %}

{% block title %}Server Error (500) — JobHelper AI{% endblock %}

{% block content %}
<div class="container py-5 text-center min-vh-75 d-flex flex-column justify-content-center align-items-center">
  <div class="display-1 fw-bold text-warning mb-2">500</div>
  <h2 class="fw-bold mb-3">Internal Server Error</h2>
  <p class="text-muted max-w-500 mb-4">
    An unexpected error occurred while processing your request. Please return to the homepage or try again shortly.
  </p>
  <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('index') }}" class="btn btn-primary px-4">
    <i class="bi bi-house-door-fill me-1"></i> Return Home
  </a>
</div>
{% endblock %}
